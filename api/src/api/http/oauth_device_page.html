<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in to Divine TV</title>
    <style>
        :root {
            color-scheme: dark;
            font: 100%/1.5 Inter, system-ui, sans-serif;
            color: #f7fff9;
            background: #092817;
        }
        body {
            display: grid;
            min-block-size: 100svh;
            align-content: center;
            margin: 0;
        }
        main {
            inline-size: min(28rem, calc(100% - 3rem));
            margin: 2rem auto;
        }
        h1 { font: 700 2rem/1.1 "Bricolage Grotesque", Inter, system-ui, sans-serif; }
        p, strong { overflow-wrap: anywhere; }
        a { color: #b2ffc8; }
        label { display: block; }
        input, button {
            box-sizing: border-box;
            min-height: 3rem;
            padding: .65rem 1rem;
            border: 1px solid #b2ffc8;
            border-radius: .5rem;
            font: inherit;
        }
        input {
            display: block;
            width: 100%;
            margin-block: .5rem 1rem;
        }
        button {
            color: #092817;
            background: #b2ffc8;
            margin: .25rem .35rem .25rem 0;
            font-weight: 700;
        }
        .secondary { color: #f7fff9; background: transparent; }
        .code { font-size: 2rem; font-weight: 700; letter-spacing: .08em; }
        [role="alert"] { color: #ffbaaa; }
    </style>
</head>
<body>
    <main>
        <!-- content -->
    </main>
</body>
</html>
