name: Challenge image contracts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Bun 1.3.10 supplies the semantic YAML parser used by the Python contracts.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.93.0
      - name: Python runtime and workflow contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_challenge_image_acceptance.py' -v
      - name: Frozen helper dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile
      - name: Helper contracts and list-only discovery regression
        working-directory: e2e
        run: bun test helpers/challenge-image.test.ts
